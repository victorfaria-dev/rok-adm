<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sun Tzu 3D</title>
<style>
  :root { --bg: #e4e5e8; --fg: #2b2a28; --btn: #ffffff; --btn-fg: #4a2e1c; --accent: #c08a3e; --muted: #6b6d72; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1f22; --fg: #ece8e1; --btn: #2c2f33; --btn-fg: #f1d9a8; --muted: #a3a6ab; }
  }
  :root[data-theme="dark"] { --bg: #1d1f22; --fg: #ece8e1; --btn: #2c2f33; --btn-fg: #f1d9a8; --muted: #a3a6ab; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #stage { flex: 1; position: relative; min-height: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  #fallback img { max-width: min(90vw, 512px); max-height: 80%; }
  #status { position: absolute; left: 16px; top: 12px; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); flex-wrap: wrap; justify-content: center; }
  button { min-height: 44px; min-width: 88px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--accent);
    background: var(--btn); color: var(--btn-fg); font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage" aria-label="Modelo 3D do Sun Tzu: arraste para girar, pinça para aproximar">
  <div id="status">carregando…</div>
  <div id="fallback"><img src="poster.png" alt="Sun Tzu, o estrategista ranzinza, mascote-guia do KingdomOps"></div>
</div>
<nav>
  <button data-clip="idle" aria-pressed="false">idle</button>
  <button data-clip="talk" aria-pressed="false">talk</button>
  <button data-clip="grumble" aria-pressed="false">grumble</button>
  <button id="reset">vista frontal</button>
</nav>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const showFallback = (msg) => {
  document.getElementById('fallback').style.display = 'flex';
  status.textContent = msg;
};
const hasWebGL = (() => { try { return !!document.createElement('canvas').getContext('webgl2'); } catch { return false; } })();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!hasWebGL) {
  showFallback('sem WebGL — mostrando imagem estática');
} else {
  try {
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    stage.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
    scene.add(camera);
    scene.add(new THREE.HemisphereLight(0xfff6ec, 0x7a746a, 1.25));
    const key = new THREE.DirectionalLight(0xfff1e0, 2.9); key.position.set(-1.8, 2.4, 1.3); camera.add(key);
    const fill = new THREE.DirectionalLight(0xe8f0ff, 0.8); fill.position.set(1.8, 0.4, 1.2); camera.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0.5, 1.5, -2.5); camera.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.52, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 0.6;
    controls.maxDistance = 4;
    const home = () => { camera.position.set(0, 0.62, 2.3); controls.update(); };
    home();

    const gltf = await new GLTFLoader().loadAsync('suntzu.glb');
    scene.add(gltf.scene);
    const mixer = new THREE.AnimationMixer(gltf.scene);
    const actions = Object.fromEntries(gltf.animations.map((c) => [c.name, mixer.clipAction(c)]));
    const buttons = [...document.querySelectorAll('button[data-clip]')];
    let current = null;
    const play = (name) => {
      const next = actions[name];
      if (!next) return;
      if (current && current !== next) current.fadeOut(0.15);
      next.reset();
      next.setLoop(name === 'idle' ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
      next.clampWhenFinished = false;
      next.fadeIn(0.15).play();
      current = next;
      buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.clip === name)));
    };
    mixer.addEventListener('finished', () => { if (!reduced) play('idle'); else buttons.forEach((b) => b.setAttribute('aria-pressed', 'false')); });
    buttons.forEach((b) => b.addEventListener('click', () => play(b.dataset.clip)));
    document.getElementById('reset').addEventListener('click', home);
    if (!reduced) play('idle');
    status.textContent = reduced ? 'movimento reduzido: animações só ao tocar' : 'arraste para girar · pinça para aproximar';

    const resize = () => {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    new ResizeObserver(resize).observe(stage);
    resize();
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    });
  } catch (e) {
    console.error(e);
    showFallback('não foi possível carregar o 3D — mostrando imagem estática');
  }
}
</script>
</body>
</html>
