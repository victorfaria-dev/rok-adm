# Netlify build for the static site. Connect the repo and pick a branch; nothing else to set.
# Cloudflare Pages uses the same values in its dashboard (see docs/hospedagem.md).
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @rokadm/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached by the browser, or updates would not reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
